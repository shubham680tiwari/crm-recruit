# ============================================================
# Candidate Manager — Application Configuration
# ============================================================

spring.application.name=candidate-manager

# --- Default profile: H2 in-memory database (zero setup) ---
spring.datasource.url=jdbc:h2:file:./data/candidatedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (dev convenience — disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson: consistent date format
spring.jackson.serialization.write-dates-as-timestamps=false

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Actuator: expose health & info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.recruitcrm=INFO
logging.level.org.springframework.web=WARN
